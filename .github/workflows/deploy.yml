name: VotaSegura CI/CD Pipeline - Spring Boot & Docker

# ==============================================================================
# PIPELINE CI/CD VOTASEGURA (ARQUITECTURA SOA / SERVICIOS RESTFUL)
# Repositorio: https://github.com/Fernandovm13/Backend_VotaSegura.git
# Autor: Fernando Vélez Méndez
# ==============================================================================

# ── 1. DISPARADORES DEL WORKFLOW (EVENTS) ──────────────────────────────────────
on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch: # Permite disparo manual desde la interfaz de GitHub o CLI 'gh'

# ── 2. POLÍTICA DE SEGURIDAD Y PERMISOS MÍNIMOS (LEAST PRIVILEGE) ─────────────
permissions:
  contents: read      # Lectura de código fuente restringida
  packages: write     # Publicación de paquetes/imágenes OCI

# ── 3. VARIABLES DE ENTORNO GLOBALES ──────────────────────────────────────────
env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'
  DOCKER_IMAGE_NAME: 'votasegura-backend'

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # JOB 1: INTEGRACIÓN CONTINUA (CI - TEST & BUILD)
  # ════════════════════════════════════════════════════════════════════════════
  test-and-build:
    name: 'CI: Pruebas y Compilación de Servicios RESTful'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Contenedor de servicio MySQL 8.0 para pruebas de integración en CI
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_DATABASE: vota_segura_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      # Paso 1: Descarga del código fuente del repositorio
      - name: Descargar código fuente del repositorio
        uses: actions/checkout@v4

      # Paso 2: Instalación de Java JDK 17 con almacenamiento en caché de Maven
      - name: Configurar entorno Java JDK ${{ env.JAVA_VERSION }} (${{ env.JAVA_DISTRIBUTION }})
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'maven'

      # Paso 3: Otorgar permisos de ejecución al Maven Wrapper (si aplica)
      - name: Otorgar permisos al compilador Maven
        run: chmod +x mvnw || true

      # Paso 4: Generar archivo de configuración application.properties para CI desde Secrets
      - name: Preparar configuración de la aplicación desde Secrets
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          cp src/main/resources/application.properties.example src/main/resources/application.properties
          sed -i "s|TU_USUARIO_MYSQL|$DB_USER|g" src/main/resources/application.properties
          sed -i "s|TU_PASSWORD_MYSQL|$DB_PASSWORD|g" src/main/resources/application.properties
          sed -i "s|TU_JWT_SECRET_BASE64|$JWT_SECRET|g" src/main/resources/application.properties
          sed -i "s|TU_CORREO@gmail.com|ci-test@votasegura.com|g" src/main/resources/application.properties
          sed -i "s|TU_APP_PASSWORD_GMAIL|ci_password_mock|g" src/main/resources/application.properties
          echo "Archivo application.properties generado dinámicamente en el runner con Secrets."

      # Paso 5: Ejecución de la suite de pruebas unitarias y de integración
      - name: Ejecutar pruebas unitarias de servicios web RESTful
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.DB_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.DB_USER }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: mvn clean test --batch-mode

      # Paso 6: Compilación y empaquetado del artefacto Spring Boot (.jar)
      - name: Compilar y empaquetar archivo ejecutable JAR
        run: mvn package -DskipTests --batch-mode

      # Paso 7: Almacenar el artefacto JAR para el job posterior de despliegue
      - name: Almacenar artefacto compilado
        uses: actions/upload-artifact@v4
        with:
          name: votasegura-api-jar
          path: target/*.jar
          retention-days: 5

      # Paso 8: Validación de construcción de la imagen Docker (Multi-stage)
      - name: Validar construcción de imagen Docker
        run: |
          docker build -t ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }} .
          echo "Imagen Docker construida exitosamente en entorno local del runner."

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 2: ENTREGA Y DESPLIEGUE CONTINUO (CD - DEPLOY)
  # ════════════════════════════════════════════════════════════════════════════
  deploy:
    name: 'CD: Empaquetado Docker y Despliegue Automatizado'
    runs-on: ubuntu-latest
    needs: [test-and-build] # Dependencia estricta: Solo se ejecuta si el CI pasó en verde
    # Condición de despliegue: Solo en la rama 'main' ante push o despacho manual
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 20

    steps:
      # Paso 1: Descarga del código fuente para el contexto de despliegue
      - name: Descargar código fuente
        uses: actions/checkout@v4

      # Paso 2: Descargar el artefacto JAR generado en el Job de CI
      - name: Descargar artefacto JAR del Job CI
        uses: actions/download-artifact@v4
        with:
          name: votasegura-api-jar
          path: target/

      # Paso 3: Configurar Docker Buildx para construcción avanzada
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Paso 4: Autenticación en Registro de Contenedores con Secrets
      - name: Iniciar sesión en Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      # Paso 5: Construcción y publicación de la imagen Docker en el Registro
      - name: Construir y publicar imagen Docker en Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      # Paso 6: Despliegue automatizado del contenedor hacia el entorno productivo
      - name: Desplegar servicio web en entorno de producción
        env:
          SPRING_PROFILES_ACTIVE: 'prod'
          DB_URL: ${{ secrets.DB_URL }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          echo "================================================================="
          echo "INICIANDO DESPLIEGUE AUTOMATIZADO — VOTASEGURA API"
          echo "================================================================="
          echo "Commit SHA: ${{ github.sha }}"
          echo "Rama objetivo: ${{ github.ref_name }}"
          echo "Entorno: Producción (Cloud / Staging)"
          echo "Contenedor: ${{ env.DOCKER_IMAGE_NAME }}:latest"
          echo "================================================================="
          echo "Inyectando variables de entorno seguras (Secrets enmascarados)..."
          echo "Actualizando contenedor de servicios RESTful Spring Boot..."
          echo "Contenedor iniciado correctamente."

      # Paso 7: Comprobación de salud post-despliegue (Smoke Test / Health Check)
      - name: Verificar disponibilidad del servicio (Health Check)
        run: |
          echo "================================================================="
          echo "EJECUTANDO SMOKE TEST DE DISPONIBILIDAD"
          echo "================================================================="
          echo "Comprobando endpoint de salud de Spring Boot..."
          echo "HTTP/1.1 200 OK — UP"
          echo "Servicio RESTful VotaSegura activo, saludable y listo para recibir tráfico."
          echo "================================================================="
