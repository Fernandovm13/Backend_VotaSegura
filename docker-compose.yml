version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: votasegura-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: vota_segura_db
      MYSQL_ROOT_PASSWORD: Fernando13!
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pFernando13!"]
      timeout: 5s
      retries: 10
      interval: 5s

  api-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: votasegura-backend
    restart: unless-stopped
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/vota_segura_db?useSSL=false&serverTimezone=America/Mexico_City&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Fernando13!
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8080:8080"
    volumes:
      - api_uploads:/app/uploads

volumes:
  mysql_data:
    driver: local
  api_uploads:
    driver: local
